[package]
name = "counter"
version = "0.1.0"
edition = "2021"
publish = false
description = "Learning sandbox: a counter stored in an account the caller passes in."

[lib]
# `cdylib` is the `.so` Mollusk loads. `lib` lets the tests share the
# instruction bytes with the program. `cargo build-sbf` warns that both
# together skip link-time optimization; that is fine for this sandbox.
crate-type = ["cdylib", "lib"]

# Host rustc does not know the Solana target os. The sBPF toolchain does.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
pinocchio = "=0.12.0"

[dev-dependencies]
mollusk-svm = "=0.17.1"
solana-account = "=5.0.0"
solana-instruction = "=4.0.0"
solana-program-error = "=3.0.1"
solana-pubkey = "=4.3.0"
